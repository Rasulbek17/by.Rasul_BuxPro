<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кадр құжаттары</title>
<style>
:root{
  --bg:#f3f4f6;--panel:#ffffff;--ink:#16181d;--mute:#667085;--line:#e1e4ea;
  --acc:#1f5eff;--acc-ink:#fff;--soft:#eaf0ff;--danger:#c4281c;--shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--panel:#181b21;--ink:#eceef2;--mute:#9aa3b2;--line:#2a2f39;--acc:#6b95ff;--acc-ink:#0b1020;--soft:#1d2540;--danger:#ff7a6e;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.1px}
header.top .sub{color:var(--mute);font-size:12.5px}
header.top .sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.ghost{color:var(--mute)}
button.mini{padding:3px 9px;font-size:12px}
button.del{color:var(--danger);padding:3px 8px}
.wrap{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;padding:16px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr;padding:12px}}
aside#form{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
aside#form details{border-bottom:1px solid var(--line)}
aside#form details:last-child{border-bottom:0}
aside#form summary{cursor:pointer;padding:11px 14px;font-weight:600;display:flex;gap:8px;align-items:center;list-style:none}
aside#form summary::-webkit-details-marker{display:none}
aside#form summary::before{content:"▸";color:var(--mute);transition:transform .15s}
aside#form details[open] summary::before{transform:rotate(90deg)}
aside#form summary small{margin-left:auto;color:var(--mute);font-weight:400;font-size:11.5px}
.fbody{padding:2px 14px 14px;display:grid;gap:9px}
.fld{display:grid;gap:3px}
.fld>span{font-size:12px;color:var(--mute)}
input[type=text],input[type=date],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.list{display:grid;gap:6px}
.list .row{display:grid;gap:5px;align-items:center;padding:7px;border:1px dashed var(--line);border-radius:8px}
.list .row .cells{display:grid;gap:5px}
.hint{font-size:11.5px;color:var(--mute)}
main{min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar .sp{flex:1}
#stage{background:var(--bg);overflow:auto;padding:4px 0 24px}
.page{width:210mm;min-height:297mm;margin:0 auto;padding:20mm 15mm 20mm 25mm;background:#fff;color:#000;box-shadow:var(--shadow);border-radius:2px}
#printRoot{display:none}

/* ===== құжат стилі (қолданбада да, Word-қа экспортта да) ===== */
.doc{font-family:'Times New Roman',Times,serif;font-size:13pt;line-height:1.35;color:#000}
.doc p{margin:0 0 6pt}
.doc .c{text-align:center}.doc .r{text-align:right}.doc .j{text-align:justify}.doc .b{font-weight:bold}
.doc .ind{text-indent:1.25cm}
.doc .sp{margin:0 0 12pt;line-height:1}
.doc .sp2{margin:0 0 26pt;line-height:1}
.doc table{border-collapse:collapse;width:100%}
.doc td,.doc th{vertical-align:top}
.doc table.grid td,.doc table.grid th{border:1px solid #000;padding:3pt 5pt}
.doc table.grid th{font-weight:bold;text-align:center}
.doc .num{text-align:right;white-space:nowrap}
.doc .ln{border-bottom:1px solid #000;height:15pt;margin:0 8pt}
.doc .cp{font-size:10pt;text-align:center;margin:0 8pt}
.doc .fill{border-bottom:1px solid #000;padding:0 4pt}
.doc .sm{font-size:10pt}
.doc .ttl{font-size:15pt;font-weight:bold;text-align:center;margin:0 0 6pt}

[hidden]{display:none!important}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 10px;font-size:12.5px;font-weight:600;background:var(--panel);color:var(--mute)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);width:min(520px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,12,18,.45)}
dialog header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
dialog header b{font-size:15px}
dialog .fbody{padding:14px 16px 6px;max-height:65vh;overflow:auto}
dialog footer{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--soft);color:var(--ink);border-bottom:1px solid var(--line);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e5a100;margin-right:6px}
.dot.ok{background:#1a9a4a}
#home{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
#home h2{margin:6px 0 4px;font-size:24px;letter-spacing:-.01em}
#home .lead{color:var(--mute);margin:0 0 20px;max-width:60ch}
.grp{margin:22px 0 10px;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);width:100%}
.card:hover{border-color:var(--acc);transform:translateY(-1px)}
.card .no{flex:none;width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.card b{display:block;font-weight:600;margin-bottom:2px}
.card small{color:var(--mute);font-size:12px}
.homebar{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;resize:vertical}
textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
aside#xform{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
#xhome{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
#xhome h2{margin:6px 0 4px;font-size:24px;letter-spacing:-.01em}
#xhome .lead{color:var(--mute);margin:0 0 20px;max-width:60ch}
select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
#kzhome h2{margin:6px 0 4px;font-size:24px;letter-spacing:-.01em}
#kzhome .lead{color:var(--mute);margin:0 0 20px;max-width:64ch}
body{background:radial-gradient(1100px 480px at 8% -8%,var(--soft),transparent 70%),var(--bg)}
header.top{backdrop-filter:blur(10px)}
.card{border-radius:14px;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{box-shadow:0 10px 28px rgba(31,94,255,.16)}
#land{max-width:980px;margin:0 auto;padding:38px 16px 52px}
#land h2{font-size:clamp(26px,5vw,40px);margin:0 0 6px;letter-spacing:-.02em}
#land .lead{color:var(--mute);margin:0 0 28px;font-size:15px}
.countries{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.cty{position:relative;text-align:left;padding:26px 24px;border-radius:20px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);overflow:hidden;min-height:220px;transition:transform .15s,border-color .15s}
.cty::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.cty::after{content:"";position:absolute;right:-44px;top:-44px;width:170px;height:170px;border-radius:50%;background:var(--c);opacity:.13}
.cty:hover{transform:translateY(-3px);border-color:var(--c)}
.cty .fl{font-size:40px;display:block;margin-bottom:6px}
.cty b{font-size:30px;letter-spacing:-.01em;display:block}
.cty small{color:var(--mute);display:block;margin-bottom:16px;font-size:13px}
.cty ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.cty li{display:flex;gap:8px;align-items:center;font-weight:550}
.cty li i{font-style:normal;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft)}
.cty.uz{--c:#0a9f6e}.cty.kz{--c:#00a3c4}
#zform details,#cform details{border-bottom:1px solid var(--line)}
#zform details:last-child,#cform details:last-child{border-bottom:0}
#zform summary,#cform summary{cursor:pointer;padding:11px 14px;font-weight:600;display:flex;gap:8px;align-items:center;list-style:none}
#zform summary::-webkit-details-marker,#cform summary::-webkit-details-marker{display:none}
#zform summary::before,#cform summary::before{content:"▸";color:var(--mute);transition:transform .15s}
#zform details[open] summary::before,#cform details[open] summary::before{transform:rotate(90deg)}
#calchome h2{margin:6px 0 4px;font-size:24px}#calchome .lead{color:var(--mute);margin:0 0 20px}
.res{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px 18px 14px}
.res h3{margin:16px 0 4px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.res table{width:100%;border-collapse:collapse}.res td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.res td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.res tr.big td{font-size:16px;font-weight:700;color:var(--acc)}.res small{color:var(--mute);font-weight:400}
@media print{
  @page{size:A4;margin:20mm 15mm 20mm 25mm}
  body{background:#fff}
  header.top,.wrap,#home,#xhome,#kzhome,#land,#calchome{display:none!important}
  #printRoot{display:block}
  #printRoot .doc{page-break-after:always}
  #printRoot .doc:last-child{page-break-after:auto}
}
</style>
</head>
<body>
<header class="top">
  <button id="bBack" hidden data-i="back"></button>
  <h1 data-i="title"></h1>
  <span class="sub" data-i="sub"></span>
  <span class="sp"></span>
  <span class="lg"><span class="seg" id="ulSeg"></span></span>
  <button id="bCo"><span data-i="co_btn"></span> <span class="dot" id="coDot"></span></button>
  <button id="bClear" class="ghost" data-i="clear"></button>
</header>

<section id="home">
  <div style="display:flex;gap:10px;align-items:center;margin:0 0 12px"><button class="mini" data-tab="s">⌂ · UZ</button><span class="seg"><button class="on" data-tab="k">Kadr</button><button class="" data-tab="x">Didox</button><button class="" data-tab="c">Kalkulyator</button></span></div>
  <h2 data-i="title"></h2>
  <p class="lead" data-i="lead"></p>
  <div class="homebar" style="margin:0 0 6px"><span class="lg"><span data-i="doclang"></span>: <span class="seg dlSeg"></span></span></div>
  <div id="cards"></div>
  <div class="homebar">
    <button id="bAllPrint" data-i="all_print"></button>
    <button id="bAllWord" data-i="all_word"></button>
  </div>
</section>

<section id="xhome" hidden>
  <div style="display:flex;gap:10px;align-items:center;margin:0 0 12px"><button class="mini" data-tab="s">⌂ · UZ</button><span class="seg"><button class="" data-tab="k">Kadr</button><button class="on" data-tab="x">Didox</button><button class="" data-tab="c">Kalkulyator</button></span></div>
  <h2>Didox hujjatlari</h2>
  <p class="lead">Didox.uz’da tuziladigan hujjat turini tanlang, ma’lumotlarni kiriting — hujjat darrov tayyor bo‘ladi. Korxona ma’lumotlari (⚙) Kadr bo‘limi bilan umumiy.</p>
  <div class="cards" id="xcards"></div>
</section>

<section id="land" hidden></section>
<section id="calchome" hidden style="max-width:1100px;margin:0 auto;padding:20px 16px 40px"></section>
<section id="kzhome" hidden style="max-width:1100px;margin:0 auto;padding:20px 16px 40px"></section>

<div class="wrap" hidden>
  <aside id="form"></aside>
  <main>
    <div class="bar">
      <b id="curTitle"></b>
      <span class="sp"></span>
      <span class="lg"><span data-i="doclang"></span>: <span class="seg dlSeg"></span></span>
      <button id="bPrint" class="pri" data-i="print"></button>
      <button id="bWord" data-i="word"></button>
    </div>
    <div id="stage"><div class="page" id="page"></div></div>
  </main>
</div>
<div class="wrap" id="xwrap" hidden>
  <aside id="xform"></aside>
  <main>
    <div class="bar"><b id="xTitle"></b><span class="sp"></span><button id="xPrint" class="pri">Chop etish / PDF</button><button id="xWord">Word (.doc)</button></div>
    <div id="xstage" style="overflow:auto;padding:4px 0 24px"><div class="page" id="xpage"></div></div>
  </main>
</div>
<div class="wrap" id="calcwrap" hidden>
  <aside id="cform" style="background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden"></aside>
  <main><div class="bar"><b id="cTitle">Mehnat ta’tili kalkulyatori</b><span class="sp"></span><button data-cact="clear" class="ghost">Tozalash</button></div><div id="cres"></div></main>
</div>
<div class="wrap" id="kzwrap" hidden>
  <aside id="zform" style="background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden"></aside>
  <main>
    <div class="bar"><b id="zTitle"></b><span class="sp"></span><button id="zPrint" class="pri">Print / PDF</button><button id="zWord">Word (.doc)</button></div>
    <div id="zstage" style="overflow:auto;padding:4px 0 24px"><div class="page" id="zpage"></div></div>
  </main>
</div>
<dialog id="dlg">
  <header><b data-i="dlg_title"></b><button id="dlgX" class="ghost mini">✕</button></header>
  <div class="fbody" id="coFields"></div>
  <footer><span class="hint" data-i="dlg_hint"></span><button id="dlgOk" class="pri" data-i="dlg_ok"></button></footer>
</dialog>
<div id="printRoot"></div>

<script>
'use strict';
/* =============== көмекші функциялар =============== */
const $=s=>document.querySelector(s);
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MONTHS=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentyabr','oktyabr','noyabr','dekabr'];
const pad=n=>String(n).padStart(2,'0');
const P=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?{y:+m[1],m:+m[2],d:+m[3]}:null};
const fd=iso=>{const x=P(iso);return x?`${pad(x.d)}.${pad(x.m)}.${x.y}`:'__.__.____'};
const yr=iso=>{const x=P(iso);return x?x.y:'____'};
const mon=iso=>{const x=P(iso);return x?MONTHS[x.m-1]:'______'};
const lng=(iso,suf)=>{const x=P(iso);return x?`${x.y} yil ${x.d} ${MONTHS[x.m-1]}${suf}`:'____ yil __ ______'+suf};
const blank=(v,len)=>e(v)||('_'.repeat(len||16));
const fill=(v,len)=>`<span class="fill">${e(v)||'&nbsp;'.repeat(len||14)}</span>`;

// ismi-sharifi qisqartmasi: "Baydullayev Sardor G’ayrat o’g’li" -> "Baydullayev S. G’."
const ini=w=>{if(!w)return'';const m=/^([GgOo][’'‘ʻʼ`])/.exec(w);return m?m[1]:w[0]};
const nameParts=n=>String(n||'').trim().split(/\s+/).filter(Boolean);
const short=n=>{const p=nameParts(n);if(!p.length)return'__________';let s=e(p[0]);if(p[1])s+=' '+e(ini(p[1]))+'.';if(p[2])s+=' '+e(ini(p[2]))+'.';return s};
const shortFI=n=>{const p=nameParts(n);if(!p.length)return'__________';return e(p[0])+(p[1]?' '+e(ini(p[1]))+'.':'')};

const grp=s=>String(s).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const fm=n=>{n=+n||0;const [a,b]=n.toFixed(2).split('.');return grp(a)+','+b};
const fq=n=>(+n||0).toFixed(2).replace('.',',');
const fapos=n=>String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'’');

// sonni so‘z bilan (o‘zbek)
const U=['','bir','ikki','uch','to‘rt','besh','olti','yetti','sakkiz','to‘qqiz'];
const T=['','o‘n','yigirma','o‘ttiz','qirq','ellik','oltmish','yetmish','sakson','to‘qson'];
const w3=n=>{const h=Math.floor(n/100),t=Math.floor(n%100/10),u=n%10,s=[];if(h)s.push((h>1?U[h]+' ':'')+'yuz');if(t)s.push(T[t]);if(u)s.push(U[u]);return s.join(' ')};
const words=n=>{n=Math.floor(+n||0);if(n===0)return'nol';let out=[];for(const [v,nm] of [[1e9,'milliard'],[1e6,'million'],[1e3,'ming'],[1,'']]){const q=Math.floor(n/v);n%=v;if(q){let t=w3(q%1000);if(nm==='ming'&&q===1)t='';out.push((t+' '+nm).trim())}}return out.join(' ')};

/* =============== boshlang‘ich (namuna) ma’lumotlar =============== */
const DEF={co_name:'',co_form:'MChJ',co_city:'',co_loc:'',co_address:'',co_stir:'',co_mfo:'',co_hr:'',co_bank:'',dir_name:'',chair_name:'',sec_name:'',emp_name:'',emp_pos1:'',emp_pos2:'',prop_name:'',meet_date:'',meet_no:'',meet_start:'',meet_end:'',dir_start:'',ord1_no:'',ord2_no:'',ord2_date:'',hire_date:'',ord3_no:'',ct_no:'',ct_type:'',ct_start:'',ct_end:'',ct_prob:'',ct_vac:'',ct_vac2:'',emp_pass:'',emp_pass_date:'',emp_pass_by:'',emp_pass_valid:'',emp_addr:'',emp_tel:'',tr_date:'',ar_tr_no:'',ord4_no:'',term_date:'',ar_term_no:'',ord5_no:'',comp_days:'',rw_date:'',ord6_no:'',dl_date:'',dl_meet_date:'',dl_meet_no:'',pos:'',name:'',unit:''
  ,dir_pos:'',emp_pos_now:'',app_date:'',lv_start:'',lv_end:'',lv_days:'',lv_return:'',lv_per_start:'',lv_per_end:'',lv_reason:'',edu_inst:'',edu_course:'',edu_form:'',edu_doc_no:'',ord7_no:'',ord7_date:'',ord8_no:'',ord8_date:'',acc_name:'',sk_start:'',sk_end:'',sk_days:'',sk_doc_no:'',sk_pct:'',resp_name:'',ulang:'kz',dlang:'uz',
  staff:[{pos:'',n:'',sal:''}],rewards:[{name:'',amt:''}],props:[{name:'',unit:'',qty:'',price:''}]
};
const KEY='kadr_bolimi_v4';
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r)return Object.assign(JSON.parse(JSON.stringify(DEF)),r)}catch(_){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}}

/* =============== форма схемасы =============== */
const SECTIONS=[
 {t:'Корхона',docs:'барлығы',open:true,f:[
  ['co_name','Корхона атауы (тырнақшасыз)','text'],['co_form','Құқықтық түрі (MChJ, XK, AJ…)','text'],
  ['co_city','Қала/облыс (құжат басында, қысқа)','text'],['co_loc','Облыс, аудан (бояннамада)','text'],
  ['co_address','Мекенжай','text'],['co_stir','STIR (ИНН)','text'],['co_mfo','MFO','text'],['co_hr','H/R (есепшот)','text'],['co_bank','Банк','text']]},
 {t:'Адамдар мен лауазымдар',docs:'барлығы',open:true,f:[
  ['dir_name','Басшы (директор) — толық аты-жөні','text'],['chair_name','Құрылтайшы — жиналыс төрағасы','text'],['sec_name','Жиналыс хатшысы','text'],

function listHTML(name){
  const L=LISTS[name],cols=L.cols.map(c=>c[3]).join(' ');
  return `<div class="list" data-list="${name}"><div class="hint">${t(L.label)}</div>`+
    S[name].map((r,i)=>`<div class="row"><div class="cells" style="grid-template-columns:${cols}">`+
      L.cols.map(([k,pl,ty])=>`<input type="${ty}" placeholder="${t(pl)}" title="${t(pl)}" data-l="${name}" data-i="${i}" data-c="${k}" value="${e(r[k])}">`).join('')+
      `</div><div style="text-align:right"><button class="del mini" data-del="${name}" data-i="${i}">${t('del')}</button></div></div>`).join('')+
    `<div><button class="mini" data-add="${name}">${t('add_row')}</button></div></div>`;

function wordsRu(n){n=Math.floor(+n||0);if(!n)return'ноль';
 const m=['','один','два','три','четыре','пять','шесть','семь','восемь','девять'],f=['','одна','две'],

 tens=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'],

 const pl=(q,a,b,c)=>{const t=q%100,u=q%10;return t>10&&t<20?c:u===1?a:u>1&&u<5?b:c};
 const g3=(q,fem)=>{const h=Math.floor(q/100),r=q%100,o=[];if(h)o.push(hun[h]);if(r>=10&&r<20)o.push(teen[r-10]);else{const t=Math.floor(r/10),u=r%10;if(t)o.push(tens[t]);if(u)o.push(fem&&u<3?f[u]:m[u])}return o.join(' ')};
 const out=[];for(const [v,a,b,c,fem] of [[1e9,'миллиард','миллиарда','миллиардов',0],[1e6,'миллион','миллиона','миллионов',0],[1e3,'тысяча','тысячи','тысяч',1],[1,'','','',0]]){
  const q=Math.floor(n/v);n%=v;if(q){const w=g3(q%1000,fem);out.push(v>1?w+' '+pl(q,a,b,c):w)}}
 return out.join(' ')}
function wordsKz(n){n=Math.floor(+n||0);if(!n)return'нөл';

 const out=[];for(const [v,nm2] of [[1e9,'миллиард'],[1e6,'миллион'],[1e3,'мың'],[1,'']]){const q=Math.floor(n/v);n%=v;if(q)out.push((g3(q%1000)+' '+nm2).trim())}

 ct_8l:['а) строго соблюдать трудовую и технологическую дисциплину (правила внутреннего трудового распорядка, уставы и положения о дисциплине);','б) выполнять законные приказы и требования работодателя, не разглашать конфиденциальную информацию предприятия (хранить тайну);','в) строго соблюдать правила охраны труда, техники безопасности, производственной, личной и коллективной гигиены;','г) знать должностные инструкции и строго их соблюдать;','д) знать и строго соблюдать квалификационные обязанности, указанные в соответствующих документах;','е) соблюдать законодательство и иные нормативные акты, определяющие трудовую деятельность;','ж) соблюдать условия коллективного договора;','з) выполнять план работы, установленный работодателем;','и) производить продукцию на уровне требуемых стандартов качества;','к) бережно и правильно использовать вверенное имущество предприятия;','л) выполнять дополнительные обязанности, возложенные в ходе трудовой деятельности;','м) соблюдать иные обязанности, принимаемые работником, и требования статей 161, 164 Трудового кодекса Республики Узбекистан, своевременно приходить на работу и уходить, обладать достаточной квалификацией и соблюдать иные требования закона.'],
 ct_9:'Обязанности Работодателя:',
 ct_9l:['а) организовать труд работника, ознакомить его с правилами охраны труда и техники безопасности, коллективными договорами и иными нормативными и локальными актами;','б) обеспечивать трудовую и производственную дисциплину;','в) своевременно выплачивать заработную плату;','г) создавать условия для безопасного и эффективного труда, обучать работника и проводить инструктаж по безопасным условиям труда;','д) оборудовать рабочее место в соответствии с правилами охраны труда и техники безопасности;','е) соблюдать законодательство и иные нормативные акты;','ж) соблюдать условия коллективного договора;','з) выполнять иные обязанности, принимаемые работодателем.'],
 ct_10:'Режим рабочего дня: шестидневная рабочая неделя; начало, обеденный перерыв и окончание рабочего времени устанавливаются «Правилами внутреннего трудового распорядка» предприятия.',
 ct_11:'Оплата труда. Работнику устанавливается следующая оплата:',
 ct_11l:['а) в размере, указанном в штатном расписании;','б) дополнительная оплата, надбавки и компенсации, связанные с условиями труда, в соответствии с действующим законодательством;','в) дополнительная оплата, надбавки, премии, поощрения и иные стимулирующие выплаты, предусмотренные коллективным договором, а также устанавливаемые руководителем в пределах имеющихся прав и средств;'],
 ct_12:'Трудовой договор может быть расторгнут в следующих случаях:',
 ct_12l:['а) по взаимному соглашению сторон;','б) в связи с недостаточной квалификацией работника;','в) при систематическом нарушении работником трудовых обязанностей;','г) при однократном грубом нарушении работником трудовых обязанностей;','д) при вступлении в законную силу приговора суда, не позволяющего работнику продолжать прежнюю работу, а также при направлении работника по решению суда в специализированное лечебно-профилактическое учреждение;','е) при нарушении установленных правил приёма на работу, если нарушение невозможно устранить и оно препятствует продолжению работы;','ж) если по медицинскому заключению работник не может продолжать выполнение возложенной на него работы либо продолжение работы причиняет вред работнику;','з) в случае смерти работника;','и) при неудовлетворительном результате испытания, установленного договором;','к) если представительная комиссия признаёт работника непригодным к трудовой деятельности (по дисциплинарным, этическим причинам, причинению ущерба предприятию и другим основаниям).'],

 ct_7:'Мерзімді еңбек шарты мерзімінен бұрын бұзылған жағдайда, Өзбекстан Республикасы Еңбек кодексінің 159-бабына сәйкес тараптар қызметкердің орташа айлық жалақысының 30%-на дейінгі мөлшерде айыппұл төлеуге тиіс.',
 ct_8:'Қызметкердің міндеттері:',
 ct_8l:['а) еңбек және технологиялық тәртіпті (ішкі еңбек тәртібі ережелерін, жарғылар мен тәртіп туралы ережелерді) қатаң сақтау;','ә) жұмыс берушінің заңды бұйрықтары мен талаптарын орындау, кәсіпорынға қатысты мәліметтердің құпиялылығын жария етпеу;','б) еңбекті қорғау, техникалық қауіпсіздік, өндірістік, жеке және ұжымдық гигиена ережелерін қатаң сақтау;','в) лауазымдық нұсқаулықтарды білу және оларды қатаң сақтау;','г) тиісті құжаттарда көрсетілген біліктілік міндеттерін білу және қатаң сақтау;','д) заң құжаттарын және еңбек қызметін айқындайтын өзге нормативтік құжаттарды сақтау;','е) ұжымдық шарт талаптарын сақтау;','ж) жұмыс беруші берген жұмыс жоспарын орындау;','з) өнімді талап етілетін сапа стандарттары деңгейінде өндіру;','и) сеніп тапсырылған кәсіпорын мүлкін дұрыс пайдалану және оны сақтау;','к) еңбек қызметі барысында жүктелген қосымша міндеттер;','л) қызметкер қабылдайтын өзге де міндеттер және Өзбекстан Республикасы Еңбек кодексінің 161, 164-баптарының талаптарын сақтау, жұмысқа уақытында келіп-кету, біліктілігінің жеткілікті болуы және заңның өзге талаптары.'],

  [...document.styleSheets[0].cssRules].filter(r=>r.selectorText&&r.selectorText.startsWith('.doc')).map(r=>r.cssText).join('\n');
function doWord(idx,name){
  const body=allHTML(idx).join('<br clear="all" style="page-break-before:always">');
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${e(name)}</title><style>${WORD_CSS}</style></head><body>${body}</body></html>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿',html],{type:'application/msword'}));
  a.download=name.replace(/[^\w.-]+/g,'_')+'.doc';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);

 r_ee:{short:[['Права и обязанности Работника определяются Трудовым кодексом Республики Казахстан, настоящим Договором, актами Работодателя и должностной инструкцией.','Жұмыскердің құқықтары мен міндеттері Қазақстан Республикасының Еңбек кодексімен, осы Шартпен, Жұмыс берушінің актілерімен және лауазымдық нұсқаулықпен айқындалады.']],

  full:[['Работодатель вправе: требовать от Работника исполнения трудовых обязанностей и бережного отношения к имуществу; поощрять Работника; привлекать его к дисциплинарной и материальной ответственности в порядке, установленном законодательством; принимать акты Работодателя в пределах своей компетенции.','Жұмыс беруші: Жұмыскерден еңбек міндеттерін орындауды және мүлікке ұқыпты қарауды талап етуге; Жұмыскерді көтермелеуге; заңнамада белгіленген тәртіппен оны тәртіптік және материалдық жауапкершілікке тартуға; өз құзыреті шегінде Жұмыс берушінің актілерін қабылдауға құқылы.'],

 h+=c.mo?R('O‘rtacha oylik daromad',m(c.avgM),`${fm(c.total)} / ${c.mo}`):R('O‘rtacha oylik daromad','—','Ishlangan oylar sonini kiriting');
 h+=R('O‘rtacha kunlik daromad',m(c.avgD),`${fm(c.avgM)} / ${String(c.dv).replace('.',',')}`)+`</table><h3>Ta’til kunlari</h3><table>`;
 h+=c.bad?R('Sanalar','Tugash sanasi boshlanishdan oldin',''):c.dates?R('Kalendar kunlar',c.cal)+R('Yakshanba kunlari','− '+c.sun)+R('Ishlanmaydigan bayram kunlari','− '+c.hol,'yakshanbaga to‘g‘ri kelgani qayta sanalmaydi')+R('To‘lanadigan kunlar',String(c.paid).replace('.',','),String(SC.manual).trim()!==''?'qo‘lda kiritilgan':'avtomatik'):R('To‘lanadigan kunlar',String(c.paid),'Ta’til sanalarini kiriting yoki kunlarni qo‘lda yozing');
 h+=`</table><h3>Hisoblangan</h3><table>`+R('Mehnat ta’tili puli',m(c.vac),`${fm(c.avgD)} × ${String(c.paid).replace('.',',')}`,'big');
 if(c.sal)h+=R('Ta’til oyidagi ish haqi',m(c.sal),`${fm(num(SC.oklad))} / ${num(SC.mdays)} × ${num(SC.wdays)}`)+R('Jami hisoblangan',m(c.gross),'','big');
 h+=`</table><h3>Soliqlar</h3><table>`+R(`JShDS jami (${num(SC.jshds)}%)`,m(c.j),'xodim ish haqidan ushlanadi')+R(`shundan INPS (${num(SC.inps)}%)`,m(c.n),'INPS ga o‘tkaziladi')+R('shundan byudjetga JShDS',m(c.jb))+R('Xodim qo‘liga',m(c.net),`${fm(c.gross)} − ${fm(c.j)}`,'big')+R(`Ijtimoiy soliq, ish beruvchi (${num(SC.ss)}%)`,m(c.sc))+`</table>`;
 if(c.gross>0){const P=(d,k,v,t)=>`<tr><td>Dt ${d} · Kt ${k}<br><small>${t}</small></td><td>${fm(v)}</td></tr>`;
  h+=`<h3>Buxgalteriya provodkalari</h3><table>`+(c.sal?P('9410','6710',c.sal,'ish haqi'):'')+P('9410','6710',c.vac,'ta’til puli')+P('6710','6420',c.j,'JShDS ushlandi')+P('6420','6530',c.n,'INPS')+P('9410','6520',c.sc,'ijtimoiy soliq')+`</table>`}
 h+=`</div>`;
 $('#cres').innerHTML=h}

/* ===== UZ: KALKULYATOR (kasallik varaqasi / больничный) ===== */
const cMode=()=>location.hash==='#calc2'?2:1;
const KK='sick_v1';
const KDEF={total:'',months:'12',div:'25.3',stazh:'',kind:'ord',pct:'',ls:'',le:'',sched:'6',h1:'',h2:'',extra:'',manual:'',oklad:'',mdays:'',wdays:'',jshds:'12',inps:'0.1',ss:'12'};
let SK=(()=>{try{return Object.assign({},KDEF,JSON.parse(localStorage.getItem(KK)||'{}'))}catch(_){return {...KDEF}}})();
const ks=()=>{try{localStorage.setItem(KK,JSON.stringify(SK))}catch(_){}};
const KINDS=[['ord','Oddiy kasallik'],['soc','Ijtimoiy ahamiyatli kasallik (OITS, sil, onkologiya, moxov)'],['x100','100%: baynalmilal jangchi, Chernobyl, 16 yoshgacha (o‘quvchi 18) 3+ bolali'],['orph','21 yoshgacha yetim (staj muhim emas) — 80%']];
const KF=[
['1. O‘rtacha oylik daromad',[['total','Hisob davridagi jami ish haqi (so‘m)','text','Oxirgi 12 oyda olingan jami summa (12 oydan kam bo‘lsa — ishlagan davrdagi jami)'],['months','To‘liq ishlangan oylar soni (12 gacha)','text'],['div','O‘rtacha oylik kunlar soni','text','25,3 = (365 − 52 yakshanba − 9 bayram) / 12']]],
['2. Kasallik va foiz',[['kind','Kasallik / xodim turi','sel'],['stazh','Umumiy ish staji (yil, masalan 7,5)','text','Barcha tashkilotlarda ishlagan davr'],['pct','Foiz, % (qo‘lda)','text','Bo‘sh qoldirsangiz staj va turga qarab avtomatik'],['ls','Kasallik boshlanishi','date'],['le','Kasallik tugashi','date'],['sched','Ish rejimi','sel'],['h1','Qo‘shimcha ishlanmaydigan kun 1','date','Hayit (2023–2026) avtomatik hisoblanadi. 2027 va undan keyingi hayit yoki ko‘chirilgan dam kunlarini shu yerga kiriting'],['h2','Qo‘shimcha ishlanmaydigan kun 2','date'],['extra','Boshqa ishlanmaydigan kunlar','text','YYYY-MM-DD, vergul bilan'],['manual','To‘lanadigan kunlar (qo‘lda)','text','Bo‘sh qoldirsangiz avtomatik']]],
['3. Ishga kelgan kunlar uchun ish haqi (ixtiyoriy)',[['oklad','Oylik oklad (so‘m)','text'],['mdays','Oydagi ish kunlari','text','6 kunlik hafta bo‘lsa — odatda 24'],['wdays','Oyda haqiqatan ishlangan kunlar','text']]],
['4. Soliqlar (ixtiyoriy)',[['jshds','JShDS (jami), %','text','Ish haqi + nafaqadan'],['inps','shundan INPS, %','text','Faqat ish haqidan, nafaqadan emas'],['ss','Ijtimoiy soliq (ish beruvchi), %','text','Faqat ish haqidan, nafaqadan emas']]]];
function cForm2(){$('#cform').innerHTML=KF.map(([h,fs],i)=>`<details${i<2?' open':''}><summary>${h}</summary><div class="fbody">${fs.map(([k,l,ty,hint])=>{
 let inp;if(ty==='sel')inp=k==='kind'?`<select data-ck="${k}">${KINDS.map(([v,t])=>`<option value="${v}"${SK[k]===v?' selected':''}>${t}</option>`).join('')}</select>`:`<select data-ck="${k}"><option value="6"${SK[k]==='6'?' selected':''}>6 kunlik hafta (yakshanba dam)</option><option value="5"${SK[k]==='5'?' selected':''}>5 kunlik hafta (shanba, yakshanba dam)</option></select>`;
 else inp=`<input type="${ty}" data-ck="${k}" value="${e(SK[k])}">`;
 return `<label class="fld"><span>${l}</span>${inp}${hint?`<span class="hint">${hint}</span>`:''}</label>`}).join('')}</div></details>`).join('')}
function sPct(kind,y){if(kind==='x100')return 100;if(kind==='orph')return 80;
 if(kind==='soc')return y>8?100:y>=5?80:60;
 return y>8?80:60}
function cCalc2(){
 const total=num(SK.total),mo=Math.min(12,Math.max(0,Math.floor(num(SK.months)))),dv=num(SK.div)||25.3;
 const avgM=mo?total/mo:0,avgD=avgM/dv;
 let cal=0,off=0,hol=0;const a=P(SK.ls),b=P(SK.le);
 if(a&&b){const s0=Date.UTC(a.y,a.m-1,a.d),e0=Date.UTC(b.y,b.m-1,b.d),ex=new Set([SK.h1,SK.h2].filter(Boolean).concat(String(SK.extra).match(/\d{4}-\d{2}-\d{2}/g)||[]));
  for(let t=s0;t<=e0&&cal<400;t+=864e5){const d=new Date(t),iso=`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`,w=d.getUTCDay();cal++;
   if(w===0||(SK.sched==='5'&&w===6)){off++;continue}
   if(FIXH.includes(iso.slice(5))||HAY.includes(iso)||ex.has(iso))hol++}}
 const auto=cal-off-hol,man=String(SK.manual).trim(),days=man!==''?num(man):auto;
 const stazh=num(SK.stazh),pa=sPct(SK.kind,stazh),pm=String(SK.pct).trim(),pct=pm!==''?num(pm):pa;
 const naf=r2(avgD*days*pct/100),wage=num(SK.mdays)>0?r2(num(SK.oklad)/num(SK.mdays)*num(SK.wdays)):0,gross=r2(naf+wage);
 const j=r2(gross*num(SK.jshds)/100),n=r2(wage*num(SK.inps)/100),sc=r2(wage*num(SK.ss)/100);
 return{total,mo,dv,avgM,avgD,cal,off,hol,auto,days,stazh,pct,pauto:pm==='',naf,wage,gross,j,n,jb:r2(j-n),sc,net:r2(gross-j),exp:r2(gross+sc),dates:!!(a&&b),bad:!!(a&&b&&Date.UTC(b.y,b.m-1,b.d)<Date.UTC(a.y,a.m-1,a.d))}}
function cRender2(){const c=cCalc2(),R=(l,v,sub,cls)=>`<tr${cls?` class="${cls}"`:''}><td>${l}${sub?`<br><small>${sub}</small>`:''}</td><td>${v}</td></tr>`,m=v=>fm(v)+' so‘m',cm=v=>String(v).replace('.',',');
 let h=`<div class="res"><h3>O‘rtacha daromad</h3><table>`;
 h+=c.mo?R('O‘rtacha oylik daromad',m(c.avgM),`${fm(c.total)} / ${c.mo}`):R('O‘rtacha oylik daromad','—','Ishlangan oylar sonini kiriting');
 h+=R('O‘rtacha kunlik daromad',m(c.avgD),`${fm(c.avgM)} / ${cm(c.dv)}`)+`</table><h3>Kasal kunlari</h3><table>`;
 h+=c.bad?R('Sanalar','Tugash sanasi boshlanishdan oldin',''):c.dates?R('Kalendar kunlar',c.cal)+R(SK.sched==='5'?'Shanba va yakshanba':'Yakshanba kunlari','− '+c.off)+R('Ishlanmaydigan bayram kunlari','− '+c.hol,'dam olish kuniga to‘g‘ri kelgani qayta sanalmaydi')+R('To‘lanadigan kunlar',cm(c.days),String(SK.manual).trim()!==''?'qo‘lda kiritilgan':'faqat ish kunlari'):R('To‘lanadigan kunlar',cm(c.days),'Kasallik sanalarini kiriting yoki kunlarni qo‘lda yozing');
 h+=`</table><h3>Hisoblangan</h3><table>`+R('Nafaqa foizi',cm(c.pct)+'%',c.pauto?`avtomatik: ${({ord:'oddiy kasallik',soc:'ijtimoiy ahamiyatli kasallik',x100:'100% toifa',orph:'yetim'})[SK.kind]}, staj ${cm(c.stazh)} yil`:'qo‘lda kiritilgan')+R('Kasallik nafaqasi',m(c.naf),`${fm(c.avgD)} × ${cm(c.days)} × ${cm(c.pct)}%`,'big');
 if(c.wage)h+=R('Ishga kelgan kunlar uchun ish haqi',m(c.wage),`${fm(num(SK.oklad))} / ${num(SK.mdays)} × ${num(SK.wdays)}`)+R('Jami hisoblangan',m(c.gross),'','big');
 h+=`</table><h3>Soliqlar</h3><table>`+R(`JShDS jami (${num(SK.jshds)}%)`,m(c.j),'ish haqi + nafaqadan')+R(`shundan INPS (${num(SK.inps)}%)`,m(c.n),'faqat ish haqidan')+R('shundan byudjetga JShDS',m(c.jb))+R('Xodim qo‘liga',m(c.net),`${fm(c.gross)} − ${fm(c.j)}`,'big')+R(`Ijtimoiy soliq, ish beruvchi (${num(SK.ss)}%)`,m(c.sc),'faqat ish haqidan, nafaqadan emas')+R('Jami xarajat',m(c.exp),`${fm(c.gross)} + ${fm(c.sc)}`)+`</table>`;
 if(c.gross>0){const P_=(d,k,v,t)=>`<tr><td>Dt ${d} · Kt ${k}<br><small>${t}</small></td><td>${fm(v)}</td></tr>`;
  h+=`<h3>Buxgalteriya provodkalari</h3><table>`+(c.wage?P_('9410','6710',c.wage,'ish haqi'):'')+P_('9410','6710',c.naf,'kasallik nafaqasi')+(c.wage?P_('9410','6520',c.sc,'ijtimoiy soliq'):'')+P_('6710','6420',c.j,'JShDS ushlandi')+(c.n?P_('6420','6530',c.n,'INPS'):'')+`</table>`}
 h+=`<h3>Eslatma</h3><p class="hint" style="margin:6px 0 0">Nafaqa faqat rasmiy kasallik varaqasi (больничный лист) asosida to‘lanadi. Nafaqadan INPS ushlanmaydi va ijtimoiy soliq to‘lanmaydi — faqat JShDS.</p></div>`;
 $('#cres').innerHTML=h}
function cForm(){cMode()===2?cForm2():cForm1()}
function cRender(){cMode()===2?cRender2():cRender1()}

 else if(b.dataset.cact==='clear'){SC={...CDEF};cs();cForm();cRender()}});

{const m=/^#d(\d+)$/.exec(location.hash);cur=m&&DOCS[+m[1]]?+m[1]:-1;show()}
